# OpenTelemetry Collector
# mode: statefulset — receptor central de telemetria
# Pipelines preparados para Tempo (traces), Mimir (metrics) e Loki (logs)
# Por enquanto exporta via debug — basta descomentar os exporters quando os backends estiverem prontos
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: otel-collector
  namespace: monitoring
spec:
  mode: statefulset
  replicas: 1

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  config:
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      batch:
        timeout: 1s
        send_batch_size: 1024

      memory_limiter:
        check_interval: 1s
        limit_mib: 400
        spike_limit_mib: 100

      k8sattributes:
        auth_type: serviceAccount
        passthrough: false
        extract:
          metadata:
            - k8s.pod.name
            - k8s.pod.uid
            - k8s.deployment.name
            - k8s.namespace.name
            - k8s.node.name
            - k8s.pod.start_time

      resource:
        attributes:
          - key: cluster.name
            value: "local-k8s"
            action: insert
          - key: deployment.environment
            value: "development"
            action: insert

    exporters:
      # Debug — visualiza toda telemetria no stdout do collector
      debug:
        verbosity: detailed

      # Tempo — descomentar quando o Tempo estiver rodando
      # otlp/tempo:
      #   endpoint: http://tempo-distributor.monitoring.svc.cluster.local:4317
      #   tls:
      #     insecure: true

      # Mimir — descomentar quando o Mimir estiver rodando
      # prometheusremotewrite/mimir:
      #   endpoint: http://mimir-nginx.monitoring.svc.cluster.local/api/v1/push
      #   tls:
      #     insecure: true

      # Loki — descomentar quando o Loki estiver rodando
      # otlphttp/loki:
      #   endpoint: http://loki-gateway.monitoring.svc.cluster.local:3100/otlp/v1/logs
      #   tls:
      #     insecure: true

    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, k8sattributes, resource, batch]
          exporters: [debug]
          # exporters: [debug, otlp/tempo]

        metrics:
          receivers: [otlp]
          processors: [memory_limiter, k8sattributes, resource, batch]
          exporters: [debug]
          # exporters: [debug, prometheusremotewrite/mimir]

        logs:
          receivers: [otlp]
          processors: [memory_limiter, k8sattributes, resource, batch]
          exporters: [debug]
          # exporters: [debug, otlphttp/loki]
