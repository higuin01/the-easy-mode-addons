apiVersion: v1
kind: ServiceAccount
metadata:
  name: wait-otel-crds-sa
  namespace: monitoring
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: wait-otel-crds-role
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
rules:
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: wait-otel-crds-rolebinding
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: wait-otel-crds-role
subjects:
  - kind: ServiceAccount
    name: wait-otel-crds-sa
    namespace: monitoring
---
apiVersion: batch/v1
kind: Job
metadata:
  name: wait-otel-crds
  namespace: monitoring
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  ttlSecondsAfterFinished: 60
  template:
    spec:
      serviceAccountName: wait-otel-crds-sa
      restartPolicy: OnFailure
      containers:
        - name: wait
          image: alpine/k8s:1.31.2
          command:
            - /bin/sh
            - -c
            - |
              echo "Aguardando CRDs do OpenTelemetry Operator..."
              for crd in \
                opentelemetrycollectors.opentelemetry.io \
                instrumentations.opentelemetry.io \
                opampbridges.opentelemetry.io; do
                echo "  Aguardando CRD: $crd"
                until kubectl get crd "$crd" &>/dev/null; do
                  sleep 5
                done
                kubectl wait crd "$crd" --for=condition=Established --timeout=180s
                echo "  ✅ $crd pronto"
              done
              echo "✅ Todos os CRDs do OpenTelemetry prontos"
