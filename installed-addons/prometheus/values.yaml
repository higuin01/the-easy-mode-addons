kube-prometheus-stack:
  crds:
    enabled: false
  
  prometheus:
    prometheusSpec:
      maximumStartupDurationSeconds: 300
      retention: 30d
      securityContext:
        runAsUser: 0
        runAsNonRoot: false
        fsGroup: 0
      resources:
        requests:
          cpu: 200m
          memory: 512Mi
        limits:
          cpu: 500m
          memory: 1Gi
      storageSpec:
        volumeClaimTemplate:
          spec:
            storageClassName: local-path
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 10Gi
  
  grafana:
    enabled: true
    securityContext:
      runAsUser: 0
      runAsNonRoot: false
      fsGroup: 0
    initChownData:
      enabled: true
      resources:
        requests:
          cpu: 50m
          memory: 32Mi
    sidecar:
      dashboards:
        enabled: true
        searchNamespace: ALL
      readinessProbe:
        httpGet:
          path: /api/health
          port: 3000
        initialDelaySeconds: 30
        periodSeconds: 10
        failureThreshold: 10
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi
    ingress:
      enabled: false
    grafana.ini:
      server:
        protocol: http
        http_port: 3000
        root_url: "%(protocol)s://%(domain)s:%(http_port)s/"
      dataproxy:
        tls_skip_verify_insecure: true
      analytics:
        check_for_updates: false
        check_for_plugin_updates: false
        reporting_enabled: false
      plugins:
        enable_alpha: false
      feature_toggles:
        enable: ""
      plugin.grafana-lokiexplore-app:
        disabled: true
    service:
      type: ClusterIP
    persistence:
      enabled: true
      storageClassName: local-path
      size: 5Gi
    adminPassword: admin123
  
  alertmanager:
    alertmanagerSpec:
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 128Mi
      storage:
        volumeClaimTemplate:
          spec:
            storageClassName: local-path
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 5Gi