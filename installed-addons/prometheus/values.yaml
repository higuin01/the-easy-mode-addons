kube-prometheus-stack:
  crds:
    enabled: true
  
  prometheus:
    prometheusSpec:
      maximumStartupDurationSeconds: 300
      retention: 30d
      resources:
        requests:
          cpu: 200m
          memory: 512Mi
        limits:
          cpu: 500m
          memory: 1Gi
      storageSpec:
        volumeClaimTemplate:
          spec:
            storageClassName: local-path
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 10Gi
  
  grafana:
    enabled: true
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi
    ingress:
      enabled: false
    grafana.ini:
      server:
        protocol: http
        http_port: 3000
        root_url: "%(protocol)s://%(domain)s:%(http_port)s/"
    service:
      type: ClusterIP
    persistence:
      enabled: true
      storageClassName: local-path
      size: 5Gi
    adminPassword: admin123
  
  alertmanager:
    alertmanagerSpec:
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 128Mi
      storage:
        volumeClaimTemplate:
          spec:
            storageClassName: local-path
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 5Gi